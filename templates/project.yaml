version: 1
project_id: sample-cli-project
display_name: Sample CLI Project

repository:
  base_branch: main
  require_clean_submission: true
  submodules: false

adapter:
  type: generic

commands:
  setup:
    - node --version
  build:
    - node scripts/build.mjs
  lint:
    - node scripts/lint.mjs
  unit:
    - node --test

runtime:
  isolation: named
  network_default: disabled
  timeout_seconds: 300
  env_allowlist:
    - PATH

test_data:
  version: v1

reviewer:
  provider: fake
  mode: exec
  fresh_thread_per_run: true
  sandbox: read-only
  network: disabled
  skill: acceptance-reviewer
  max_turns: 2

gate:
  policy_version: v1

automation:
  enabled: false

human_gates:
  - contract_change
  - baseline_update
  - architecture_change
  - release
  - irreversible_action
